services:
  postgres:
    image: postgres:18
    container_name: weave-postgres
    environment:
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: weave
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata:
